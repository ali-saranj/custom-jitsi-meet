name: Publish Android SDK to GitHub & Azure

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install JS dependencies
        run: yarn install

      - name: Build & Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          AZURE_ARTIFACTS_USER: ${{ secrets.AZURE_ARTIFACTS_USER }}
          AZURE_ARTIFACTS_TOKEN: ${{ secrets.AZURE_ARTIFACTS_TOKEN }}
        run: |
          cd android
          ./gradlew assembleRelease
          # Publish sub-modules to both repositories
          # Note: We use --continue and || true to ensure we attempt all publications even if some fail due to conflict
          ./gradlew publish -x :sdk:publishReleasePublicationToGitHubPackagesRepository -x :sdk:publishReleasePublicationToKasraMavenFeedRepository --continue || true
          # Publish main SDK to both
          ./gradlew :sdk:publish
