plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sample'
    compileSdk 35

    defaultConfig {
        applicationId "com.sample"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

repositories {
    mavenLocal()
    google()
    mavenCentral()
    maven {
        url = uri("https://maven.pkg.github.com/ali-saranj/custom-jitsi-meet")
        credentials {
            def props = new Properties()
            def localProps = rootProject.file("local.properties")
            if (localProps.exists()) {
                props.load(new FileInputStream(localProps))
            }
            username = props.getProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR") ?: ""
            password = props.getProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN") ?: ""
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation "io.github.ali-saranj:custom-jitsi-sdk:2.0.2-dirty"
}
