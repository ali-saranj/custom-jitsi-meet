apply plugin: 'com.android.library'
apply plugin: 'com.facebook.react'
apply plugin: 'maven-publish'

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        buildConfigField "String", "SDK_VERSION", "\"$sdkVersion\""
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "LIBRE_BUILD", "${rootProject.ext.libreBuild}"
            buildConfigField "boolean", "GOOGLE_SERVICES_ENABLED", "${rootProject.ext.googleServicesEnabled}"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            buildConfigField "boolean", "LIBRE_BUILD", "${rootProject.ext.libreBuild}"
            buildConfigField "boolean", "GOOGLE_SERVICES_ENABLED", "${rootProject.ext.googleServicesEnabled}"
        }
    }

    sourceSets {
        main {
            java {
                exclude "test/"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions {
        pickFirst '**/*.so'
        pickFirst 'lib/**/libc++_shared.so'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/AL2.0'
        exclude 'META-INF/LGPL2.1'
        exclude 'META-INF/kotlin-project-structure-metadata.json'
    }
    namespace 'org.jitsi.meet.sdk'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'androidx.fragment:fragment:1.4.1'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    api "com.facebook.react:react-android:$rootProject.ext.rnVersion"
    api "com.facebook.react:hermes-android:$rootProject.ext.rnVersion"

    implementation 'com.dropbox.core:dropbox-core-sdk:4.0.1'
    implementation 'com.jakewharton.timber:timber:5.0.1'
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'androidx.startup:startup-runtime:1.1.0'
    implementation 'com.google.j2objc:j2objc-annotations:3.0.0'

    // Only add these packages if we are NOT doing a LIBRE_BUILD
    if (!rootProject.ext.libreBuild) {
        implementation project(':amplitude-analytics-react-native')
        implementation project(':giphy-react-native-sdk')
        implementation(project(':react-native-google-signin-google-signin')) {
            exclude group: 'com.google.android.gms'
            exclude group: 'androidx'
        }
    }

    implementation project(':react-native-async-storage-async-storage')
    implementation project(':react-native-background-timer')
    implementation project(':react-native-calendar-events')
    implementation project(':react-native-clipboard-clipboard')
    implementation project(':react-native-community-netinfo')
    implementation project(':react-native-default-preference')
    implementation(project(':react-native-device-info')) {
        exclude group: 'com.google.firebase'
        exclude group: 'com.google.android.gms'
        exclude group: 'com.android.installreferrer'
    }
    implementation project(':react-native-gesture-handler')
    implementation project(':react-native-get-random-values')
    implementation project(':sayem314-react-native-keep-awake')
    implementation project(':react-native-orientation-locker')
    implementation project(':react-native-pager-view')
    implementation project(':react-native-performance')
    implementation project(':react-native-safe-area-context')
    implementation project(':react-native-screens')
    implementation project(':react-native-community-slider')
    implementation project(':react-native-sound')
    implementation project(':react-native-splash-view')
    implementation project(':react-native-svg')
    implementation project(':react-native-video')
    implementation project(':react-native-webview')
    implementation project(':react-native-worklets-core')

    // Use `api` here so consumers can use WebRTCModuleOptions.
    api project(':react-native-webrtc')

    testImplementation 'junit:junit:4.12'
}


// Here we bundle all assets, resources and React files. We cannot use the
// react.gradle file provided by react-native because it's designed to be used
// in an application (it taps into applicationVariants, but the SDK is a library
// so we need libraryVariants instead).
android.libraryVariants.all { def variant ->
    // Create variant and target names
    def targetName = variant.name.capitalize()
    def targetPath = variant.dirName

    // React js bundle directories
    def jsBundleDir = file("$buildDir/generated/assets/react/${targetPath}")
    def resourcesDir = file("$buildDir/generated/res/react/${targetPath}")

    def jsBundleFile = file("$jsBundleDir/index.android.bundle")

    def currentBundleTask = tasks.create(
            name: "bundle${targetName}JsAndAssets",
            type: Exec) {
        group = "react"
        description = "bundle JS and assets for ${targetName}."

        // Create dirs if they are not there (e.g. the "clean" task just ran)
        doFirst {
            jsBundleDir.deleteDir()
            jsBundleDir.mkdirs()
            resourcesDir.deleteDir()
            resourcesDir.mkdirs()
        }

        // Set up inputs and outputs so gradle can cache the result
        def reactRoot = file("${projectDir}/../../")
        inputs.files fileTree(dir: reactRoot, excludes: ["android/**", "ios/**"])
        outputs.dir jsBundleDir
        outputs.dir resourcesDir

        // Set up the call to the react-native cli
        workingDir reactRoot

        // Set up dev mode
        def devEnabled = !targetName.toLowerCase().contains("release")

        commandLine(
                "node",
                "node_modules/react-native/scripts/bundle.js",
                "--platform", "android",
                "--dev", "${devEnabled}",
                "--reset-cache",
                "--entry-file", "index.android.js",
                "--bundle-output", jsBundleFile,
                "--assets-dest", resourcesDir)

        // Disable bundling on dev builds
        enabled !devEnabled
    }

    // Ensure proper task ordering for Gradle 8.14+ strict dependency validation
    currentBundleTask.configure {
        mustRunAfter {
            def config = project.configurations.findByName("${targetPath}CompileClasspath")
            
            // Fallback to an empty list(mustRunAfter expects a list, not "null" which is the og fallback), 
            // means no config, means no constraints
            (config?.allDependencies ?: [])
                .findAll { it.hasProperty('dependencyProject') }
                .collectMany { dependency ->
                    project.project(dependency.dependencyProject.path)
                        .tasks.matching { it.name.contains(targetName) }
                }
        }
    }
    
    currentBundleTask.ext.generatedResFolders = files(resourcesDir).builtBy(currentBundleTask)
    currentBundleTask.ext.generatedAssetsFolders = files(jsBundleDir).builtBy(currentBundleTask)
    variant.registerGeneratedResFolders(currentBundleTask.generatedResFolders)

    def mergeAssetsTask = variant.mergeAssetsProvider.get()
    def mergeResourcesTask = variant.mergeResourcesProvider.get()

    mergeAssetsTask.dependsOn(currentBundleTask)
    mergeResourcesTask.dependsOn(currentBundleTask)

    mergeAssetsTask.doLast {
        def assetsDir = mergeAssetsTask.outputDir.get()

        // Bundle sounds
        //
        copy {
            from("${projectDir}/../../sounds")
            include("*.wav")
            include("*.mp3")
            into("${assetsDir}/sounds")
        }

        // Copy React assets
        //
        if (currentBundleTask.enabled) {
            copy {
                from(jsBundleFile)
                into(assetsDir)
            }
        }
    }

    mergeResourcesTask.doLast {
        // Copy React resources
        //
        if (currentBundleTask.enabled) {
            copy {
                from(resourcesDir)
                into(mergeResourcesTask.outputDir.get())
            }
        }
    }
}


def getGitVersion() {
    def stdout = new ByteArrayOutputStream()
    try {
        exec {
            commandLine 'git', 'describe', '--tags', '--always', '--dirty'
            standardOutput = stdout
        }
        def version = stdout.toString().trim()
        if (version.startsWith("v")) {
            version = version.substring(1)
        }
        return version
    } catch (Exception e) {
        return "1.0.0-SNAPSHOT"
    }
}

def getGithubUser() {
    def props = new Properties()
    def localProps = project.rootProject.file("local.properties")
    if (localProps.exists()) {
        props.load(new FileInputStream(localProps))
    }
    return props.getProperty("gpr.user") ?: project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR") ?: ""
}

def getGithubToken() {
    def props = new Properties()
    def localProps = project.rootProject.file("local.properties")
    if (localProps.exists()) {
        props.load(new FileInputStream(localProps))
    }
    return props.getProperty("gpr.key") ?: project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN") ?: ""
}

def getAzureUser() {
    def props = new Properties()
    def localProps = project.rootProject.file("local.properties")
    if (localProps.exists()) {
        props.load(new FileInputStream(localProps))
    }
    return props.getProperty("azure.user") ?: project.findProperty("azure.user") ?: System.getenv("AZURE_ARTIFACTS_USER") ?: ""
}

def getAzureToken() {
    def props = new Properties()
    def localProps = project.rootProject.file("local.properties")
    if (localProps.exists()) {
        props.load(new FileInputStream(localProps))
    }
    return props.getProperty("azure.token") ?: project.findProperty("azure.token") ?: System.getenv("AZURE_ARTIFACTS_TOKEN") ?: ""
}

task sourcesJar(type: Jar) {
    archiveClassifier.set('sources')
    from android.sourceSets.main.java.srcDirs
}

publishing {
    publications {
        release(MavenPublication) {
            groupId 'io.github.ali-saranj'
            artifactId 'custom-jitsi-sdk'
            version getGitVersion()

            artifact("${project.buildDir}/outputs/aar/${project.name}-release.aar") {
                extension "aar"
            }
            artifact sourcesJar

            pom.withXml {
                def pomXml = asNode()
                pomXml.appendNode('name', 'custom-jitsi-sdk')
                pomXml.appendNode('description', 'Jitsi Meet SDK for Android')
                def dependencies = pomXml.appendNode('dependencies')
                
                // Add dependencies from 'releaseCompileClasspath'
                try {
                    configurations.getByName('releaseCompileClasspath').getResolvedConfiguration().getFirstLevelModuleDependencies().each {
                        def groupId = it.moduleGroup
                        def artifactId = it.moduleName

                        if (artifactId.contains('react-native')) {
                            groupId = rootProject.ext.moduleGroupId
                        }

                        def dependency = dependencies.appendNode('dependency')
                        dependency.appendNode('groupId', groupId)
                        dependency.appendNode('artifactId', artifactId)
                        dependency.appendNode('version', it.moduleVersion)
                    }
                } catch (Exception e) {
                    println("Warning: Could not resolve dependencies for POM.")
                }
            }
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/ali-saranj/custom-jitsi-meet")
            credentials {
                username = getGithubUser()
                password = getGithubToken()
            }
        }
        maven {
            name = "KasraMavenFeed"
            url = uri("https://tfs.kasraco.net/tfs/Kasra/AllTeams/_packaging/kasra-maven-feed/maven/v1")
            authentication {
                basic(BasicAuthentication)
            }
            credentials {
                username = getAzureUser()
                password = getAzureToken()
            }
        }
    }
}

